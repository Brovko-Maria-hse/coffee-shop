<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Форма заказа — кофейня «Зерно»</title>
  <!-- Bootstrap 5: готовые стили и компоненты -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body id="top" class="d-flex flex-column min-vh-100">
  <header class="bg-brand text-white text-center py-3">
    <h1 class="h2 m-0">Кофейня «Зерно»</h1>
  </header>
  <!-- Единое меню: текущая страница выделена классом active; на телефоне сворачивается в кнопку -->
  <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Открыть меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav w-100 justify-content-between gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="program.html">Я и моя образовательная программа</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html">Магазин</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="form.html">Форма заказа</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4 flex-grow-1">
    <h2 class="text-center mb-4">Заказ кофе</h2>
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <!-- GET на google.com/search? ; отправку перехватывает script.js -->
        <form id="order-form" action="https://www.google.com/search?" method="get" target="_blank">
          <div class="mb-3">
            <label for="user_name" class="form-label">ФИО</label>
            <input type="text" class="form-control" id="user_name" name="user_name" value="Бровко Мария" required>
          </div>
          <div class="mb-3">
            <label for="delivery_address" class="form-label">Адрес доставки</label>
            <input type="text" class="form-control" id="delivery_address" name="delivery_address" value="Нижний Новгород, ул. Большая Покровская, 1" required>
          </div>
          <div class="mb-3">
            <label for="quantity" class="form-label">Количество пачек</label>
            <input type="number" class="form-control" id="quantity" name="quantity" min="1" max="20" value="1" required>
          </div>
          <fieldset class="mb-3">
            <legend class="fs-6">Сорт кофе</legend>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="coffee_type" id="type-arabica" value="arabica" checked>
              <label class="form-check-label" for="type-arabica">Арабика</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="coffee_type" id="type-robusta" value="robusta">
              <label class="form-check-label" for="type-robusta">Робуста</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="coffee_type" id="type-blend" value="blend">
              <label class="form-check-label" for="type-blend">Смесь</label>
            </div>
          </fieldset>
          <fieldset class="mb-3">
            <legend class="fs-6">Способ оплаты</legend>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="payment" id="pay-card" value="card" checked>
              <label class="form-check-label" for="pay-card">Картой</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="payment" id="pay-cash" value="cash">
              <label class="form-check-label" for="pay-cash">Наличными</label>
            </div>
          </fieldset>
          <button type="submit" class="btn btn-primary">Отправить заказ</button>
        </form>
        <div id="order-preview" class="alert alert-secondary mt-3 pre-line" hidden></div>
      </div>
    </div>
  </main>
  <footer class="bg-brand text-white text-center py-3 mt-auto">© 2026 Кофейня «Зерно». Учебный проект</footer>
</body>
</html>
