<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Форма заказа — кофейня «Зерно»</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body id="top">
  <header><h1>Кофейня «Зерно»</h1></header>
  <!-- Единое меню: текущая страница выделена классом active -->
  <nav class="site-nav" aria-label="Основное меню">
    <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="program.html">Я и моя образовательная программа</a></li>
        <li><a href="shop.html">Магазин</a></li>
        <li><a href="form.html" class="active" aria-current="page">Форма заказа</a></li>
    </ul>
  </nav>
  <main class="wrapper">
    <h2>Заказ кофе</h2>
    <!-- GET на google.com/search? ; отправку перехватывает script.js -->
    <form id="order-form" action="https://www.google.com/search?" method="get" target="_blank">
      <label>ФИО
        <input type="text" name="user_name" value="Бровко Мария" required>
      </label>
      <label>Адрес доставки
        <input type="text" name="delivery_address" value="Нижний Новгород, ул. Большая Покровская, 1" required>
      </label>
      <label>Количество пачек
        <input type="number" name="quantity" min="1" max="20" value="1" required>
      </label>
      <fieldset>
        <legend>Сорт кофе</legend>
        <label class="inline"><input type="radio" name="coffee_type" value="arabica" checked> Арабика</label>
        <label class="inline"><input type="radio" name="coffee_type" value="robusta"> Робуста</label>
        <label class="inline"><input type="radio" name="coffee_type" value="blend"> Смесь</label>
      </fieldset>
      <fieldset>
        <legend>Способ оплаты</legend>
        <label class="inline"><input type="radio" name="payment" value="card" checked> Картой</label>
        <label class="inline"><input type="radio" name="payment" value="cash"> Наличными</label>
      </fieldset>
      <button type="submit">Отправить заказ</button>
    </form>
    <p id="order-preview" class="result-box" hidden></p>
  </main>
  <footer>© 2026 Кофейня «Зерно». Учебный проект</footer>
</body>
</html>
