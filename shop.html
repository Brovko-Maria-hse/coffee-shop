<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Магазин — кофейня «Зерно»</title>
  <!-- Bootstrap 5: готовые стили и компоненты -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body id="top" class="d-flex flex-column min-vh-100">
  <header class="bg-brand text-white text-center py-3">
    <h1 class="h2 m-0">Кофейня «Зерно»</h1>
  </header>
  <!-- Единое меню: текущая страница выделена классом active; на телефоне сворачивается в кнопку -->
  <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Открыть меню">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav w-100 justify-content-between gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="program.html">Я и моя образовательная программа</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="shop.html">Магазин</a></li>
          <li class="nav-item"><a class="nav-link" href="form.html">Форма заказа</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-4 flex-grow-1">
    <h2 class="text-center mb-4">Каталог кофе</h2>
    <!-- Панель: сортировка (круглые кнопки) и поиск -->
    <div class="d-flex flex-wrap align-items-center gap-2 mb-4">
      <button type="button" id="sort-price" class="btn btn-outline-secondary rounded-pill px-4">Price</button>
      <button type="button" id="sort-title" class="btn btn-outline-secondary rounded-pill px-4">Title</button>
      <div class="flex-grow-1 search-box">
        <input type="search" id="search" class="form-control rounded-pill" placeholder="Поиск по названию и описанию" aria-label="Поиск">
      </div>
    </div>
    <!-- Сетка Bootstrap: 1 колонка на телефоне, 2 на планшете, 4 на компьютере. Карточки создаёт script.js из data.json -->
    <div id="shop-grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3"></div>
    <button type="button" id="add-to-cart" class="btn btn-primary mt-4">В корзину</button>
  </main>
  <footer class="bg-brand text-white text-center py-3 mt-auto">© 2026 Кофейня «Зерно». Учебный проект</footer>
</body>
</html>
